[build]
  command = "npm run build"
  publish = "dist"
  # 무료 플랜 크레딧 절약: 문서·DB 마이그레이션·Edge Function만 바뀐 커밋은 빌드하지 않는다 (종료 코드 0 = 건너뜀).
  # 비교 기준(CACHED_COMMIT_REF)이 없거나 같은 커밋 재시도면 항상 빌드한다.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)docs" ":(exclude)README.md" ":(exclude)CLAUDE.md" ":(exclude)supabase"'

[build.environment]
  NODE_VERSION = "24"

# SPA: 모든 경로를 index.html로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 서비스워커와 매니페스트는 항상 최신본을 받도록 캐시하지 않는다
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
